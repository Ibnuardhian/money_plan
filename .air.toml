# Air config for money_plan using cmd/web/main.go
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -mod=mod -o ./tmp/web.exe ./cmd/web"
  bin = "tmp/web.exe"
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["tmp", "vendor", ".git", ".vscode", "test"]
  exclude_file = []
  follow_symlink = true
  delay = 1000
  kill_delay = 500
  send_interrupt = true
  stop_on_error = true

[log]
  level = "debug"
